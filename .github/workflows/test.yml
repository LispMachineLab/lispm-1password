name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      # The desktop 1Password opens in, from its own repository, for the
      # test of its window there.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-desktop
          path: .deps/lispm-desktop
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-browser
          path: .deps/lispm-browser
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Test
        run: >-
          make test compile
          LISPM_DESKTOP=.deps/lispm-desktop/lisp
          LISPM_BROWSER=.deps/lispm-browser/lisp
